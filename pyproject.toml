[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zebra"
version = "0.1.0"
description = "Byte-level memory accounting for continual-learning intrusion detection on constrained IoT devices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Safayat Bin Hakim" }]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pydantic>=2.6",
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
]
figures = ["matplotlib>=3.8"]

[project.scripts]
zebra = "zebra.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["zebra"]
mypy_path = "src"
exclude = ["tests/"]

# pandas-stubs is a dev extra; the loader is the only module that touches
# pandas and its boundary is covered by an explicit cast.
[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: needs the corpus on disk, slower",
    "slow: full-grid runs",
]

[tool.coverage.run]
source = ["src/zebra"]
